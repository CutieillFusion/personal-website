        - heading "Fusion language overview" [level=2] [ref=e35]
        - paragraph [ref=e36]:
          - text: Fusion is a small, systems-style language designed to call into existing C APIs (including CUDA and NCCL) with as little ABI friction as possible. Programs are compiled to LLVM IR and JIT-executed against a C runtime that handles printing, file I/O, dynamic loading (
          - code [ref=e37]: dlopen
          - text: /
          - code [ref=e38]: dlsym
          - text: ), and
          - code [ref=e39]: libffi
          - text: "-based FFI calls."
        - paragraph [ref=e40]:
          - text: At a high level, a
          - code [ref=e41]: .fusion
          - text: "file looks like this:"
        - list [ref=e42]:
          - listitem [ref=e43]:
            - text: Optional
            - code [ref=e44]: opaque
            - text: and
            - code [ref=e45]: struct
            - text: type declarations.
          - listitem [ref=e46]:
            - text: One or more
            - code [ref=e47]: extern lib
            - text: and
            - code [ref=e48]: extern fn
            - text: declarations describing C functions in
            - code [ref=e49]: .so
            - text: libraries.
          - listitem [ref=e50]:
            - text: Zero or more user
            - code [ref=e51]: fn
            - text: definitions.
          - listitem [ref=e52]:
            - text: A sequence of top-level
            - code [ref=e53]: let
            - text: bindings,
            - code [ref=e54]: if
            - text: /
            - code [ref=e55]: elif
            - text: /
            - code [ref=e56]: else
            - text: statements,
            - code [ref=e57]: for
            - text: loops, assignments, and expressions that are executed in order.
        - paragraph [ref=e58]:
          - text: The compiler synthesizes a
          - code [ref=e59]: fusion_main
          - text: function that evaluates the top-level items sequentially; user-defined functions are called from that top-level code or from other functions.
        - separator [ref=e60]
