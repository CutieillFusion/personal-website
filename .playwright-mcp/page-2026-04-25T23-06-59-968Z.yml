        - heading "FFI declarations and interop" [level=2] [ref=e776]
        - heading "Declaring libraries" [level=3] [ref=e777]
        - paragraph [ref=e778]: You can declare external libraries in two ways.
        - paragraph [ref=e779]:
          - strong [ref=e780]: "Simple form:"
        - code [ref=e782]:
          - generic [ref=e783]: extern lib "libm.so.6";
          - generic [ref=e784]: "extern fn cos(x: f64) -> f64;"
        - paragraph [ref=e785]:
          - text: The compiler assigns an internal name like
          - code [ref=e786]: __lib0
          - text: and binds
          - code [ref=e787]: cos
          - text: to that library.
        - paragraph [ref=e788]:
          - strong [ref=e789]: "Block form with explicit functions:"
        - code [ref=e791]:
          - generic [ref=e792]: "extern lib \"mylib.so\" {"
          - generic [ref=e793]: fn foo() -> void;
          - generic [ref=e794]: "fn bar(x: i64) -> i64;"
          - generic [ref=e795]: "};"
        - paragraph [ref=e796]: All functions inside the block are associated with the same library.
        - paragraph [ref=e797]: "You can also alias the library name:"
        - code [ref=e799]:
          - generic [ref=e800]: extern lib "libm.so.6" as libm;
          - generic [ref=e801]: "extern fn cos(x: f64) -> f64;"
        - heading "Declaring external functions" [level=3] [ref=e802]
