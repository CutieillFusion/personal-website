              - cell "ptr" [ref=e862]:
                - code [ref=e863]: ptr
              - cell "void*" [ref=e864]:
                - code [ref=e865]: void*
            - row "(strings) use ptr; C side is const char* or void* as appropriate" [ref=e866]:
              - cell "(strings)" [ref=e867]
              - cell "use ptr; C side is const char* or void* as appropriate" [ref=e868]:
                - text: use
                - code [ref=e869]: ptr
                - text: ; C side is
                - code [ref=e870]: const char*
                - text: or
                - code [ref=e871]: void*
                - text: as appropriate
            - row "struct/opaque name pointer to that type (T*)" [ref=e872]:
              - cell "struct/opaque name" [ref=e873]
              - cell "pointer to that type (T*)" [ref=e874]:
                - text: pointer to that type (
                - code [ref=e875]: T*
                - text: )
        - paragraph [ref=e876]: "The platform assumptions for v1 are:"
        - list [ref=e877]:
          - listitem [ref=e878]: Linux x86-64
          - listitem [ref=e879]: SysV AMD64 ABI
          - listitem [ref=e880]:
            - text: ELF shared libraries (
            - code [ref=e881]: .so
            - text: )
        - heading "Calling externs from Fusion" [level=3] [ref=e882]
        - paragraph [ref=e883]: "Putting it all together:"
        - code [ref=e885]:
          - generic [ref=e886]: extern lib "libm.so.6";
          - generic [ref=e887]: "extern fn cos(x: f64) -> f64;"
          - generic [ref=e888]: let v = cos(0.0);
          - generic [ref=e889]: print(v);
        - paragraph [ref=e890]: "At runtime, the generated code:"
        - list [ref=e891]:
          - listitem [ref=e892]:
            - text: Uses the C runtime to
            - code [ref=e893]: dlopen("libm.so.6")
            - text: .
          - listitem [ref=e894]:
            - text: Uses
            - code [ref=e895]: dlsym
            - text: to find the
            - code [ref=e896]: cos
            - text: symbol.
          - listitem [ref=e897]:
            - text: Uses
            - code [ref=e898]: libffi
            - text: to prepare and invoke a call with one
            - code [ref=e899]: double
            - text: argument and
            - code [ref=e900]: double
            - text: return.
          - listitem [ref=e901]:
            - text: Unmarshals the result back into a Fusion
            - code [ref=e902]: f64
            - text: .
        - paragraph [ref=e903]:
          - text: More advanced examples (structs by pointer, out-parameters) are covered in tests and example
          - code [ref=e904]: .fusion
          - text: programs such as
          - code [ref=e905]: example.fusion
          - text: ","
          - code [ref=e906]: example_points.fusion
          - text: ", and"
          - code [ref=e907]: train_moons.fusion
          - text: .
        - separator [ref=e908]
        - heading "Execution model and CLI" [level=2] [ref=e909]
        - paragraph [ref=e910]:
          - text: The
          - code [ref=e911]: fusion
          - text: CLI is built in
          - code [ref=e912]: build/compiler/fusion
          - text: ". It supports:"
        - list [ref=e913]:
          - listitem [ref=e914]:
            - code [ref=e915]: fusion --help
            - text: /
            - code [ref=e916]: fusion -h
            - text: – show help and usage.
          - listitem [ref=e917]:
            - code [ref=e918]: fusion --version
            - text: /
            - code [ref=e919]: fusion -v
            - text: – show compiler and LLVM version.
          - listitem [ref=e920]:
            - code [ref=e921]: fusion run file.fusion
            - text: – compile and JIT-run a
            - code [ref=e922]: .fusion
            - text: file.
          - listitem [ref=e923]:
            - code [ref=e924]: fusion file.fusion
            - text: – shorthand for
            - code [ref=e925]: fusion run file.fusion
            - text: .
        - paragraph [ref=e926]: "On each run, the compiler:"
        - list [ref=e927]:
          - listitem [ref=e928]: Lexes the input.
          - listitem [ref=e929]: Parses into an AST.
          - listitem [ref=e930]: Runs semantic checks (types, FFI declarations, built-in usage, etc.).
          - listitem [ref=e931]: Lowers to LLVM IR, verifies the module, and JITs it.
          - listitem [ref=e932]:
            - text: Executes
            - code [ref=e933]: fusion_main
            - text: .
        - paragraph [ref=e934]: Errors are reported with a message and (where possible) line/column information from the parser or semantic analyzer.
        - heading "Common errors and diagnostics" [level=3] [ref=e935]
        - paragraph [ref=e936]: "Some common classes of semantic errors:"
        - list [ref=e937]:
          - listitem [ref=e938]:
            - strong [ref=e939]: Undefined variable
            - text: ":"
            - code [ref=e941]:
              - generic [ref=e942]: let x = 1;
              - generic [ref=e943]: "print(y); # y is undefined"
          - listitem [ref=e944]:
            - strong [ref=e945]: Wrong arity
            - text: ":"
            - code [ref=e947]:
              - generic [ref=e948]: "print(1, 2, 3); # print only accepts 1 or 2 arguments"
          - listitem [ref=e949]:
            - strong [ref=e950]: Invalid FFI declaration
            - text: ":"
            - list [ref=e951]:
              - listitem [ref=e952]: Extern function refers to an unknown library.
              - listitem [ref=e953]: Extern function uses an unknown struct/opaque type name.
          - listitem [ref=e954]:
            - strong [ref=e955]:
              - text: Invalid
              - code [ref=e956]: len
              - text: argument
            - text: ":"
            - code [ref=e958]:
              - generic [ref=e959]: let n = 5;
              - generic [ref=e960]: "let x = len(n); # len expects a pointer (array)"
          - listitem [ref=e961]:
            - strong [ref=e962]: Invalid casts
            - text: "or mis-typed pointer operations:"
            - list [ref=e963]:
              - listitem [ref=e964]:
                - code [ref=e965]: load
                - text: /
                - code [ref=e966]: load_f64
                - text: /
                - code [ref=e967]: load_ptr
                - text: /
                - code [ref=e968]: load_i32
                - text: require pointer arguments.
              - listitem [ref=e969]:
                - code [ref=e970]: store
                - text: requires a pointer as the first argument.
              - listitem [ref=e971]:
                - code [ref=e972]: as
                - text: target type must be one of the supported numeric or pointer-like types.
        - paragraph [ref=e973]: The error messages are designed to be explicit about which built-in or function caused the problem.
        - separator [ref=e974]
        - heading "Architecture (high level)" [level=2] [ref=e975]
        - paragraph [ref=e976]: "Conceptually, Fusion’s execution stack looks like this:"
        - document [ref=e978]:
          - generic [ref=e981]:
            - generic [ref=e986]: FusionSource(.fusion)
            - generic [ref=e991]: Lexer
            - generic [ref=e996]: Parser
            - generic [ref=e1001]: AST
            - generic [ref=e1006]: SemanticAnalysis
            - generic [ref=e1011]: LLVMIRGeneration
            - generic [ref=e1016]: LLVMJIT
            - generic [ref=e1021]: CRuntime(rt_*)
            - generic [ref=e1026]: FFIEngine(libffi+libdl)
            - generic [ref=e1031]: SharedLibraries(.so)
        - list [ref=e1032]:
          - listitem [ref=e1033]:
            - text: The
            - strong [ref=e1034]: compiler frontend
            - text: (lexer, parser, semantic analysis) is implemented in C++.
          - listitem [ref=e1035]:
            - text: The
            - strong [ref=e1036]: backend
            - text: uses LLVM to build and JIT modules.
          - listitem [ref=e1037]:
            - text: The
            - strong [ref=e1038]: C runtime
            - text: (
            - code [ref=e1039]: runtime_c
            - text: ) provides printing, file I/O, dynamic loading, and FFI services.
          - listitem [ref=e1040]:
            - text: The
            - strong [ref=e1041]: FFI engine
            - text: uses
            - code [ref=e1042]: libffi
            - text: and
            - code [ref=e1043]: libdl
            - text: to dynamically call into arbitrary
            - code [ref=e1044]: .so
            - text: libraries.
        - paragraph [ref=e1045]:
          - text: For much more detail on this architecture and the long-term roadmap (including CUDA/NCCL integration and potential bindgen tooling), read
          - code [ref=e1046]: fusion-design-document.md
          - text: .
        - separator [ref=e1047]
        - heading "Build and test (Linux)" [level=2] [ref=e1048]
        - paragraph [ref=e1049]: "The simplest way to configure, build, and run all tests:"
        - code [ref=e1051]:
          - generic [ref=e1052]: ./make.sh
        - paragraph [ref=e1053]: "Flags:"
        - list [ref=e1054]:
          - listitem [ref=e1055]:
            - code [ref=e1056]: ./make.sh
            - text: — configure (if needed), build, and run all tests
          - listitem [ref=e1057]:
            - code [ref=e1058]: ./make.sh -r
            - text: — clean rebuild from scratch (removes
            - code [ref=e1059]: build/
            - text: first)
          - listitem [ref=e1060]:
            - code [ref=e1061]: ./make.sh -d
            - text: — debug build with AddressSanitizer (
            - code [ref=e1062]: "-fsanitize=address -g"
            - text: )
          - listitem [ref=e1063]:
            - code [ref=e1064]: ./make.sh -n
            - text: — use Ninja instead of Make (requires
            - code [ref=e1065]: ninja-build
            - text: )
        - paragraph [ref=e1066]: "Or manually:"
        - code [ref=e1068]:
          - generic [ref=e1069]: cmake -B build -S .
          - generic [ref=e1070]: cmake --build build -j$(nproc)
          - generic [ref=e1071]: ctest --test-dir build --output-on-failure
        - heading "Faster builds" [level=3] [ref=e1072]
        - paragraph [ref=e1073]: "Several options can speed up rebuilds:"
        - list [ref=e1074]:
          - listitem [ref=e1075]:
            - strong [ref=e1076]: Ninja generator
            - text: —
            - code [ref=e1077]: ./make.sh -n
            - text: or
            - code [ref=e1078]: cmake -B build -S . -G Ninja
            - text: . Faster incremental builds than Make.
          - listitem [ref=e1079]:
            - strong [ref=e1080]: ccache
            - text: — Enabled by default (
            - code [ref=e1081]: "-DFUSION_USE_CCACHE=ON"
            - text: ). Install with
            - code [ref=e1082]: sudo apt install ccache
            - text: . Run
            - code [ref=e1083]: ccache -s
            - text: to check hit rates.
          - listitem [ref=e1084]:
            - strong [ref=e1085]: Faster linker (mold/lld)
            - text: —
            - code [ref=e1086]: cmake -B build -S . -DFUSION_USE_FAST_LINKER=ON
            - text: . Tries
            - code [ref=e1087]: mold
            - text: first, then
            - code [ref=e1088]: lld
            - text: . Install with
            - code [ref=e1089]: sudo apt install mold
            - text: or
            - code [ref=e1090]: sudo apt install lld
            - text: .
          - listitem [ref=e1091]:
            - strong [ref=e1092]: Precompiled headers
            - text: — LLVM headers in
            - code [ref=e1093]: codegen.cpp
            - text: are precompiled automatically via CMake’s
            - code [ref=e1094]: target_precompile_headers
            - text: ", speeding up rebuilds of codegen."
        - heading "Exit criteria (Phase 0)" [level=3] [ref=e1095]
        - list [ref=e1096]:
          - listitem [ref=e1097]:
            - strong [ref=e1098]:
              - code [ref=e1099]: fusion --help
            - text: — Run
            - code [ref=e1100]: ./build/compiler/fusion --help
            - text: for usage.
          - listitem [ref=e1101]:
            - strong [ref=e1102]: Runtime
            - text: —
            - code [ref=e1103]: build/runtime_c/libruntime.so
            - text: and
            - code [ref=e1104]: build/runtime_c/libruntime.a
            - text: are produced.
          - listitem [ref=e1105]:
            - strong [ref=e1106]: Tests
            - text: —
            - code [ref=e1107]: ctest --test-dir build
            - text: runs the C test runner and the
            - code [ref=e1108]: fusion --help
            - text: test.
        - separator [ref=e1109]
        - heading "Language server (LSP) and VS Code extension" [level=2] [ref=e1110]
        - paragraph [ref=e1111]:
          - text: Fusion ships a Language Server Protocol implementation in the
          - code [ref=e1112]: lsp/
          - text: directory. After building, the binary is at
          - code [ref=e1113]: build/lsp/fusion_lsp
          - text: .
        - paragraph [ref=e1114]:
          - strong [ref=e1115]: "Build the LSP server only:"
        - code [ref=e1117]:
          - generic [ref=e1118]: cmake --build build --target fusion_lsp
        - paragraph [ref=e1119]:
          - strong [ref=e1120]: "Features:"
        - list [ref=e1121]:
          - listitem [ref=e1122]: Hover documentation
          - listitem [ref=e1123]: Go to definition
          - listitem [ref=e1124]: Document and workspace symbols
          - listitem [ref=e1125]: Completion (keywords, functions, variables)
          - listitem [ref=e1126]: Signature help
          - listitem [ref=e1127]: Document highlight and references
          - listitem [ref=e1128]: Rename symbol
          - listitem [ref=e1129]: Semantic token coloring (keywords, types, functions, variables, parameters)
          - listitem [ref=e1130]: Folding ranges
          - listitem [ref=e1131]: Inlay hints (parameter names at call sites)
          - listitem [ref=e1132]: Diagnostics (errors from the compiler, with multi-error support)
        - paragraph [ref=e1133]:
          - strong [ref=e1134]: "VS Code / Cursor:"
          - text: See
          - code [ref=e1135]: vscode-fusion/
          - text: for the extension. Install it from the
          - code [ref=e1136]: vscode-fusion
          - text: "folder (Developer: Install Extension from Location…). The extension auto-detects"
          - code [ref=e1137]: build/fusion_lsp
          - text: relative to the workspace root, or you can set
          - code [ref=e1138]: fusion.serverPath
          - text: in VS Code settings.
        - separator [ref=e1139]
        - heading "User-local dependencies (~/.local)" [level=2] [ref=e1140]
        - paragraph [ref=e1141]:
          - text: On systems where libffi or zlib are not available as dev packages (e.g. no sudo), you can install them under
          - code [ref=e1142]: ~/.local
          - text: and point the build there.
        - paragraph [ref=e1143]:
          - strong [ref=e1144]: 1. Install libffi
        - code [ref=e1146]:
          - generic [ref=e1147]: mkdir -p "$HOME/src" "$HOME/.local"
          - generic [ref=e1148]: cd "$HOME/src"
          - generic [ref=e1149]: curl -LO https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          - generic [ref=e1150]: tar -xzf libffi-3.4.6.tar.gz
          - generic [ref=e1151]: cd libffi-3.4.6
          - generic [ref=e1152]: ./configure --prefix="$HOME/.local"
          - generic [ref=e1153]: make -j
          - generic [ref=e1154]: make install
        - paragraph [ref=e1155]:
          - strong [ref=e1156]: 2. Install zlib
          - text: (if you see link errors for
          - code [ref=e1157]: compress2
          - text: ","
          - code [ref=e1158]: uncompress
          - text: ","
          - code [ref=e1159]: crc32
          - text: )
        - code [ref=e1161]:
          - generic [ref=e1162]: cd "$HOME/src"
          - generic [ref=e1163]: curl -LO https://zlib.net/zlib-1.3.1.tar.gz
          - generic [ref=e1164]: tar -xzf zlib-1.3.1.tar.gz
          - generic [ref=e1165]: cd zlib-1.3.1
          - generic [ref=e1166]: ./configure --prefix="$HOME/.local"
          - generic [ref=e1167]: make -j
          - generic [ref=e1168]: make install
        - paragraph [ref=e1169]:
          - strong [ref=e1170]: 3. Use them when building
        - paragraph [ref=e1171]:
          - text: Source the env script so CMake and the compiler find headers and libs in
          - code [ref=e1172]: ~/.local
          - text: ":"
        - code [ref=e1174]:
          - generic [ref=e1175]: source ./env_local_deps.sh
          - generic [ref=e1176]: ./test.sh
        - paragraph [ref=e1177]:
          - text: "Or for a manual build:"
          - code [ref=e1178]: source ./env_local_deps.sh
          - text: then run
          - code [ref=e1179]: cmake -B build
          - text: ","
          - code [ref=e1180]: cmake --build build
          - text: ", etc."
        - paragraph [ref=e1181]:
          - strong [ref=e1182]: Sanity check
          - text: "(after sourcing):"
          - code [ref=e1183]: pkg-config --modversion libffi
          - text: and
          - code [ref=e1184]: pkg-config --modversion zlib
          - text: should print versions.
        - paragraph [ref=e1185]:
          - strong [ref=e1186]: "Option A via CMake:"
          - text: "If you prefer not to install libffi manually, you can have CMake download and build it into the build tree:"
        - code [ref=e1188]:
          - generic [ref=e1189]: cmake -B build -S . -DFUSION_FETCH_LIBFFI=ON
          - generic [ref=e1190]: cmake --build build
        - paragraph [ref=e1191]:
          - text: This uses ExternalProject to fetch libffi 3.4.6 and install it under
          - code [ref=e1192]: build/_deps/libffi-install
          - text: (no
          - code [ref=e1193]: ~/.local
          - text: or
          - code [ref=e1194]: env_local_deps.sh
          - text: needed).
        - separator [ref=e1195]
        - heading "LLVM (required)" [level=2] [ref=e1196]
        - paragraph [ref=e1197]:
          - text: LLVM is required to build Fusion. If LLVM is not installed, CMake will try to find it; on Linux, if not found, CMake can download a pre-built LLVM into
          - code [ref=e1198]: build/_deps/llvm
          - text: on first configure (set
          - code [ref=e1199]: FUSION_DOWNLOAD_LLVM=ON
          - text: ", which is the default on Linux)."
        - paragraph [ref=e1200]:
          - strong [ref=e1201]: "Auto-download (no sudo):"
          - text: On Linux, if LLVM is not found, CMake downloads a pre-built LLVM (x86_64 Linux) into
          - code [ref=e1202]: build/_deps/llvm
          - text: ". To disable auto-download and supply LLVM yourself:"
        - code [ref=e1204]:
          - generic [ref=e1205]: cmake -B build -S . -DFUSION_DOWNLOAD_LLVM=OFF
        - paragraph [ref=e1206]: "To use a different LLVM version when auto-downloading:"
        - code [ref=e1208]:
          - generic [ref=e1209]: cmake -B build -S . -DFUSION_LLVM_VERSION=18.1.7
        - paragraph [ref=e1210]: If LLVM cannot be found or downloaded, configure will fail with an error.
