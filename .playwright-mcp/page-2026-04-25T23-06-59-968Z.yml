          - code [ref=e675]: ptr
          - text: .
        - paragraph [ref=e676]:
          - strong [ref=e677]: "Note:"
          - code [ref=e678]: "-> ptr[T]"
          - text: in a return-type position has different semantics (array-element return), which is an existing, unchanged feature.
        - heading "File I/O" [level=3] [ref=e679]
        - paragraph [ref=e680]: "The C runtime provides simple file APIs surfaced through built-ins:"
        - code [ref=e682]:
