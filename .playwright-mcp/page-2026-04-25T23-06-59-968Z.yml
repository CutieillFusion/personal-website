            - text: ","
            - code [ref=e817]: f64
            - text: ","
            - code [ref=e818]: ptr
            - text: ","
            - code [ref=e819]: void
            - text: ) map directly to FFI primitive kinds.
          - listitem [ref=e820]: Named types (structs and opaques) are treated as pointers at the ABI layer.
        - paragraph [ref=e821]: "The compiler verifies:"
