    - generic [ref=e13]:
      - paragraph [ref=e14]: I'm Dylan Norquist, a developer who likes building projects in his free time. I'm an Applied AI Intern at Direct Supply, where I previously worked as a Data Science and Software Engineering Intern. I build rapid prototypes in Python, PostgreSQL, and React — full-stack applications that apply AI to problems in the elderly care industry.
      - paragraph [ref=e15]: I'm a Computer Science major at the Milwaukee School of Engineering (MSOE) with a focus in Machine Learning and Low Level Programming. My undergraduate research has been on Behavior Cloning from online videos, and Fall 2025 I'll be researching Reinforcement Learning for generalization and world modeling.
      - paragraph [ref=e16]: Outside of school and work I rock climb, play video games, and code. My favorite project so far is a working neural network running on an 8-bit computer inside Minecraft. A close second is sending a V9 boulder problem by dynoing to the top and skipping the entire problem.
      - paragraph [ref=e17]: This site exists mostly so I have somewhere to write things down. I plan to keep tinkering with it as I go.
