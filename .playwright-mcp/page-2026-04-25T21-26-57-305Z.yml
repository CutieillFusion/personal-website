        - paragraph [ref=e18]: I rebuilt this site from scratch. The previous version was a Next.js app with a Postgres-backed CMS, an admin panel, an LLM chatbot, and a fair amount of plumbing for what amounted to a personal page. It was fun to build, but it stopped being fun to maintain.
        - paragraph [ref=e19]:
          - text: The new version is plain Astro. Posts are hand-authored
          - code [ref=e20]: .astro
          - text: files. There is no database, no auth, and no API surface. Every page is static HTML at build time.
        - heading "What I'll write about" [level=2] [ref=e21]
        - paragraph [ref=e22]: Mostly machine learning notes, the occasional side project, and whatever I'm currently thinking about at MSOE or at work. If a post would survive being half-finished and unpolished, it'll probably show up here.
